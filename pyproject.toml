[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maenvs4vrp"
version = "0.3"
description = "Multi Agent Environments for Vehicle Routing Problems"
authors = [
    {name = "mustelideos"}
]
readme = "README.rst"
license = {text = "MIT"}
requires-python = ">=3.11, <4"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "multi-agent",
    "reinforcement-learning",
    "vehicle-routing",
    "vrp",
    "operations-research",
    "optimization",
]

dependencies = [
    "numpy>=2.3.1",
    "tqdm>=4.66.1",
    "pandas>=2.3.0",
    "matplotlib>=3.10.5",
    "torch>=2.7.0,<3.0",
    "tensorboard>=2.13.0",
    "scipy>=1.0.0",
    "wandb>=0.10.0",
    "huggingface_hub>=0.10.0",
    "ml_collections>=0.1.0",
    "tensordict>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
]
docs = [
    "sphinx-math-dollar>=1.2.1",
    "nbsphinx>=0.9.5",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]

[project.urls]
Homepage = "https://github.com/ricgama/maenvs4vrp"
Documentation = "https://maenvs4vrp.readthedocs.io"
Repository = "https://github.com/ricgama/maenvs4vrp"
"Bug Tracker" = "https://github.com/ricgama/maenvs4vrp/issues"
"Paper" = "https://arxiv.org/abs/2411.14411"

[tool.setuptools.packages.find]
where = ["."]
include = ["maenvs4vrp*"]
exclude = ["tests*", "docs*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
